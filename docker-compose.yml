version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verifact-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./verifact.db
      - SECRET_KEY=change_this_to_a_secure_random_key_in_production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      - ./backend/fractoes.db:/app/fractoes.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: verifact-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
